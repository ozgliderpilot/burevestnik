name: Post weather to Telegram

on:
  schedule:
    - cron: '17 6/12 * * *'  # Runs at 17 minutes past the hour, every 12 hours, starting 6 AM UTC
  workflow_dispatch: {}   # manual trigger for testing
  push:
    branches: [master, main]   # CI test on push (skips cron logic)

jobs:
  post:
    runs-on: ubuntu-latest
    environment: prd            # use the "prd" environment's secrets
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Install Python deps (with dev)
        if: github.event_name == 'push'
        run: uv sync --extra dev --frozen

      - name: Install Python deps (runtime only)
        if: github.event_name != 'push'
        run: uv sync --frozen

      - name: Run tests
        if: github.event_name == 'push'
        run: uv run pytest

      - name: Resolve Playwright version
        if: github.event_name != 'push'
        id: pw
        shell: bash
        run: |
          v=$(uv run python -c "from importlib.metadata import version; print(version('playwright'))")
          echo "version=$v" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browsers
        if: github.event_name != 'push'
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.pw.outputs.version }}

      - name: Install Chromium browser
        if: github.event_name != 'push' && steps.playwright-cache.outputs.cache-hit != 'true'
        # System libs (libnss3, libasound2t64, ...) are preinstalled on the
        # GitHub-hosted Ubuntu image because it ships Chromium. Skip `--with-deps`
        # to avoid `apt-get update`.
        run: uv run playwright install chromium

      - name: Post to Telegram
        if: github.event_name != 'push'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: uv run python -m burevestnik.main
