[project]
name = "burevestnik"
version = "0.1.0"
description = "Telegram bot posting meteoblue Melbourne CBD forecast"
requires-python = ">=3.12"
dependencies = [
    "playwright>=1.40",
    "httpx>=0.25",
    "astral>=3.2",
    "selectolax>=0.3.20",
]

[project.optional-dependencies]
dev = ["pytest>=7"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/burevestnik"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v"
pythonpath = ["src"]
